# SolidWorks-specific profile: host tools plus the default CAD preset.
# Permission defaults to 'workspace-write' (approval: ask) rather than 'danger-full-access':
# host shell tools are disabled and solidworks-policy restricts the agent to the 17 approved
# CAD/support tools, while 'ask' preserves the native confirmation dialog for confirm_action.

- insert:
    - id: mcp-solidworks-orchestrator
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: solidworks
        transport: stdio
        command: __PYTHON__
        args:
          - __DSH_SERVER__
        cwd: __DSH_ADAPTER_DIR__
        env:
          DSH_HOME: __DSH_HOME__
        toolCallTimeoutMs: 1800000
        failOnStartupError: true

- id: agent-presets
  config:
    default: solidworks-cad

- id: sandbox-policy
  config:
    mode: workspace-write

- id: approval
  config:
    policy: ask

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
