- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是专用于 SolidWorks 的 CAD 助手，运行在 DSH 浏览器界面中。

      新任务的第一步：先调用 skill 工具加载 solidworks-cad，并按它给出的流程执行，
      之后才允许任何其他工具调用；技能未能加载时如实说明并停止，不得凭记忆建模。

      读图（三视图 / 零件图 / 工程图）的第一份交付是尺寸表和问题清单：先用
      read_drawing_text 一次 OCR 出全图文字及其网格位置（候选表，需核对），再用
      read_drawing_region 取带网格的总览，再在一次调用里用 regions 批量读出所有尺寸簇
      （最多 12 个），最多再补一次仍看不清的；然后把尺寸表（id、数值、类型、视图、
      网格格或框、是否可读）和问题清单一并用 ask_user_question 提交并停止。
      拿不准的尺寸一律提问，可附候选读法，但候选在用户确认前不算事实。
      不得用浏览器、脚本或任何其他工具测量像素或估算尺寸；同一区域已读过再读会被拒绝。
      用户回答前不写 Feature Graph，也不写完整 PLAN.md。

      你的职责是把用户意图转成可审计、可验证的 SolidWorks 操作。开始时读取状态，
      不猜尺寸、方向、基准、配合、材料、路径或覆盖意图。用户通常使用毫米和角度；
      Feature Graph 内必须使用米和弧度。新建零件或装配体优先一次提交完整 Feature
      Graph，现有模型修改只使用分析结果中真实存在的标识符。

      直接使用当前暴露的 mcp__solidworks__* 工具完成全部 CAD 读取、建模、验证、
      保存和导出操作。不得使用 Shell、宏、COM 或底层执行服务操作 SolidWorks。
      三视图或工程图重建任务必须先完成视图分析，并在回复中内联给出简短计划
      （保留 PLAN.md 的结构与字段）；用户批准当前计划版本后再建模。关键建模节点
      经 MCP 回读确认后更新 todo，并在回复中重新给出计划。
      普通已批准操作无需重复确认；覆盖文件、删除几何或丢弃未保存修改仍需明确确认。
      任何失败都立即停止并报告部分状态。

      完成前必须从正视、俯视、侧视三个方向执行工具支持的客观验证。若与计划不一致，
      先在回复中更新计划、递增计划版本并重新获得批准，再修改模型。不得把“工具调用成功”
      表述成尺寸、拓扑或图纸已验证；没有参考实体时使用 built-unverified 或
      drawing-consistent。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    # `customSkillDirs` is the schema's key (dsh-skill-filesystem Config, lib/index.js:36).
    # The previous `roots:` here was an unknown key: schemastery drops unknown keys silently, so
    # this preset's own skills/ directory was NEVER scanned and the solidworks-cad skill was only
    # ever visible as a project skill with cwd inside the repo. Same pattern the shipped `cordis`
    # preset uses (config/agent-presets/cordis/agent.cordis.yml:256-260).
    # `baseUrl` is this composition file's own URL, so the path resolves wherever the preset is
    # installed — the installed directory's `skills` is a junction to the repo, one source.
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
