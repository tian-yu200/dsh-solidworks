<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="dsh-solidworks Verified Benchmarks Dashboard">
  <defs>
    <linearGradient id="bmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101D" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <pattern id="bmGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18253E" stroke-width="0.7" />
    </pattern>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="370" rx="16" fill="url(#bmBg)" />
  <rect x="0" y="0" width="1200" height="370" rx="16" fill="url(#bmGrid)" opacity="0.8" />
  <rect x="14" y="14" width="1172" height="342" rx="10" fill="none" stroke="#283E63" stroke-width="1.2" />

  <!-- Header -->
  <text x="34" y="45" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#FBBF24" letter-spacing="1.2">MEASURED BENCHMARKS · LOCAL REAL-MACHINE RUNS</text>
  <text x="34" y="70" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">本机真机实测指标（SolidWorks 2025 · gpt-6.1-sol high）</text>

  <!-- Left Card: 2026-11-18 Blind Test Suite -->
  <g transform="translate(34, 88)">
    <rect x="0" y="0" width="588" height="252" rx="12" fill="#0B1323" stroke="#263D63" stroke-width="1.2" />
    <text x="20" y="27" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.8">GB BLIND SET t401–t410 (10 DRAWINGS × 3 ROUNDS = 30 RUNS)</text>
    <line x1="18" y1="37" x2="570" y2="37" stroke="#1E3152" />

    <!-- 3 Big Stat Tiles -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="172" height="84" rx="10" fill="#0E211D" stroke="#195945" />
      <text x="14" y="38" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#34D399">86.7%</text>
      <text x="14" y="59" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">止损容差总通过</text>
      <text x="14" y="75" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#6EE7B7">26 / 30 有效运行</text>

      <rect x="188" y="0" width="172" height="84" rx="10" fill="#0E1D2F" stroke="#264C78" />
      <text x="202" y="38" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#38BDF8">80.0%</text>
      <text x="202" y="59" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">3 轮全对稳定率</text>
      <text x="202" y="75" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#7DD3FC">8 / 10 张图三连对</text>

      <rect x="376" y="0" width="172" height="84" rx="10" fill="#1D190F" stroke="#785319" />
      <text x="390" y="38" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#FBBF24">76.7%</text>
      <text x="390" y="59" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">±1% 严格通过</text>
      <text x="390" y="75" font-family="'Cascadia Mono', monospace" font-size="10" fill="#FDE68A">23/30 · 8/9离散≤0.11%</text>
    </g>

    <!-- LEDGER_INVALID Evolution Bars -->
    <text x="20" y="158" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#CBD5E1">尺寸账本异常率（LEDGER_INVALID）三阶段演进：从 31.8% 降至彻底清零</text>

    <g transform="translate(20, 170)" font-family="'Cascadia Mono', monospace" font-size="11">
      <text x="0" y="13" fill="#94A3B8">Wave 0 · 4b7dc30</text>
      <rect x="138" y="2" width="320" height="14" rx="7" fill="#162136" />
      <rect x="138" y="2" width="170" height="14" rx="7" fill="#F43F5E" />
      <text x="470" y="13" fill="#FDA4AF" font-weight="700">31.8% (7/22)</text>

      <text x="0" y="37" fill="#94A3B8">Wave 1 · 37f5ac1</text>
      <rect x="138" y="26" width="320" height="14" rx="7" fill="#162136" />
      <rect x="138" y="26" width="96" height="14" rx="7" fill="url(#amberBar)" />
      <text x="470" y="37" fill="#FDE68A" font-weight="700">18.2% (2/11)</text>

      <text x="0" y="61" fill="#E2E8F0" font-weight="700">Wave 2 · H26 Fix</text>
      <rect x="138" y="50" width="320" height="14" rx="7" fill="#162136" stroke="#10B981" stroke-opacity="0.5" />
      <rect x="138" y="50" width="8" height="14" rx="4" fill="url(#emeraldBar)" />
      <text x="470" y="61" fill="#34D399" font-weight="700">0.0% (0/20 ✓)</text>
    </g>
  </g>

  <!-- Right Card: Latency & Tool Overhead Gains -->
  <g transform="translate(642, 88)">
    <rect x="0" y="0" width="524" height="252" rx="12" fill="#0B1323" stroke="#263D63" stroke-width="1.2" />
    <text x="20" y="27" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.8">TOOL BOUNDARY &amp; LATENCY GAINS (v2.0+ DESKTOP / LIVE)</text>
    <line x1="18" y1="37" x2="506" y2="37" stroke="#1E3152" />

    <!-- Metric rows -->
    <g transform="translate(20, 54)" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
      <!-- Row 1 -->
      <text x="0" y="14" font-size="12.5" font-weight="700" fill="#E2E8F0">单次请求工具暴露</text>
      <text x="235" y="14" font-family="'Cascadia Mono', monospace" font-size="12" fill="#94A3B8">177 →</text>
      <text x="288" y="14" font-family="'Cascadia Mono', monospace" font-size="14" font-weight="700" fill="#38BDF8">25</text>
      <rect x="330" y="3" width="154" height="12" rx="6" fill="#162136" />
      <rect x="330" y="3" width="22" height="12" rx="6" fill="url(#cyanBar)" />
      <text x="484" y="13" text-anchor="end" font-family="'Cascadia Mono', monospace" font-size="10" fill="#7DD3FC">-86%</text>

      <!-- Row 2 -->
      <text x="0" y="50" font-size="12.5" font-weight="700" fill="#E2E8F0">加载技能目录数</text>
      <text x="235" y="50" font-family="'Cascadia Mono', monospace" font-size="12" fill="#94A3B8">164 →</text>
      <text x="288" y="50" font-family="'Cascadia Mono', monospace" font-size="14" font-weight="700" fill="#34D399">1</text>
      <rect x="330" y="39" width="154" height="12" rx="6" fill="#162136" />
      <rect x="330" y="39" width="10" height="12" rx="5" fill="url(#emeraldBar)" />
      <text x="484" y="49" text-anchor="end" font-family="'Cascadia Mono', monospace" font-size="10" fill="#6EE7B7">专用单技能</text>

      <!-- Row 3 -->
      <text x="0" y="86" font-size="12.5" font-weight="700" fill="#E2E8F0">73 面几何读取耗时</text>
      <text x="225" y="86" font-family="'Cascadia Mono', monospace" font-size="12" fill="#94A3B8">105s →</text>
      <text x="280" y="86" font-family="'Cascadia Mono', monospace" font-size="14" font-weight="700" fill="#FBBF24">0.70s</text>
      <rect x="330" y="75" width="154" height="12" rx="6" fill="#162136" />
      <rect x="330" y="75" width="8" height="12" rx="4" fill="url(#amberBar)" />
      <text x="484" y="85" text-anchor="end" font-family="'Cascadia Mono', monospace" font-size="10" fill="#FDE68A">~150× 提速</text>

      <!-- Row 4 -->
      <text x="0" y="122" font-size="12.5" font-weight="700" fill="#E2E8F0">简单步骤往返耗时</text>
      <text x="212" y="122" font-family="'Cascadia Mono', monospace" font-size="12" fill="#94A3B8">25–50s →</text>
      <text x="282" y="122" font-family="'Cascadia Mono', monospace" font-size="14" font-weight="700" fill="#38BDF8">~9s</text>
      <rect x="330" y="111" width="154" height="12" rx="6" fill="#162136" />
      <rect x="330" y="111" width="38" height="12" rx="6" fill="url(#cyanBar)" />
      <text x="484" y="121" text-anchor="end" font-family="'Cascadia Mono', monospace" font-size="10" fill="#7DD3FC">复用缓存</text>
    </g>

    <!-- Desktop Single-Run Highlight Box -->
    <g transform="translate(20, 194)">
      <rect x="0" y="0" width="484" height="44" rx="8" fill="#141C2E" stroke="#473818" />
      <text x="14" y="19" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#FDE68A">桌面实测单次运行 · 2-25 支架：批准到出模型 1.3 分钟</text>
      <text x="14" y="35" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94A3B8">脚踏座读图提问从 12.5 min 降至 5.5 min（仅需一轮批准）</text>
    </g>
  </g>
</svg>
