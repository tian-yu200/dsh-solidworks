<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="dsh-solidworks 5-Step Deterministic Workflow Pipeline">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101D" />
      <stop offset="100%" stop-color="#111B30" />
    </linearGradient>
    <pattern id="wfGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#18253E" stroke-width="0.7" />
    </pattern>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38BDF8" />
    </marker>
    <marker id="wfLoopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#F59E0B" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="370" rx="16" fill="url(#wfBg)" />
  <rect x="0" y="0" width="1200" height="370" rx="16" fill="url(#wfGrid)" opacity="0.8" />
  <rect x="14" y="14" width="1172" height="342" rx="10" fill="none" stroke="#283E63" stroke-width="1.2" />

  <!-- Header -->
  <text x="34" y="45" font-family="'Cascadia Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">WORKFLOW · DETERMINISTIC EVIDENCE CHAIN</text>
  <text x="34" y="70" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#F8FAFC">从原图识读到客观核验交付：五步受控闭环</text>

  <rect x="888" y="34" width="278" height="28" rx="14" fill="#2A171B" stroke="#F43F5E" stroke-opacity="0.55" />
  <text x="1027" y="52" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#FDA4AF">铁律：严禁按像素比例估算任何尺寸</text>

  <!-- 5 Workflow Cards -->
  <!-- Card 1 -->
  <g transform="translate(32, 92)">
    <rect x="0" y="0" width="208" height="142" rx="12" fill="#0F192D" stroke="#2F4A75" stroke-width="1.3" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#38BDF8" />
    <rect x="14" y="16" width="38" height="20" rx="6" fill="#162947" />
    <text x="33" y="30" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">01</text>
    <text x="60" y="30" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">原图直读与裁图</text>
    <text x="14" y="54" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#7DD3FC">OCR + batch 2× region</text>
    <line x1="14" y1="64" x2="194" y2="64" stroke="#1E3152" />
    <text x="14" y="83" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">先看全图，按需调用内置</text>
    <text x="14" y="100" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">OCR 与批量 2× 放大裁切。</text>
    <text x="14" y="122" font-family="'Cascadia Mono', monospace" font-size="10" fill="#94A3B8">EXPLICIT / DERIVED / UNKNOWN</text>
  </g>

  <line x1="242" y1="163" x2="262" y2="163" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#wfArrow)" />

  <!-- Card 2 -->
  <g transform="translate(264, 92)">
    <rect x="0" y="0" width="208" height="142" rx="12" fill="#0F192D" stroke="#5A421C" stroke-width="1.3" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#F59E0B" />
    <rect x="14" y="16" width="38" height="20" rx="6" fill="#2B2110" />
    <text x="33" y="30" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#FBBF24">02</text>
    <text x="60" y="30" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">一轮提问与批准</text>
    <text x="14" y="54" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#FCD34D">ask_user_question</text>
    <line x1="14" y1="64" x2="194" y2="64" stroke="#2D261B" />
    <text x="14" y="83" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">只就真未知尺寸提一轮</text>
    <text x="14" y="100" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">问题，附推荐值并合并</text>
    <text x="14" y="117" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">建模计划一次性批准。</text>
  </g>

  <line x1="474" y1="163" x2="494" y2="163" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#wfArrow)" />

  <!-- Card 3 -->
  <g transform="translate(496, 92)">
    <rect x="0" y="0" width="208" height="142" rx="12" fill="#0F192D" stroke="#2F4A75" stroke-width="1.3" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#38BDF8" />
    <rect x="14" y="16" width="38" height="20" rx="6" fill="#162947" />
    <text x="33" y="30" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">03</text>
    <text x="60" y="30" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">确定性图编译</text>
    <text x="14" y="54" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#7DD3FC">submit_feature_graph</text>
    <line x1="14" y1="64" x2="194" y2="64" stroke="#1E3152" />
    <text x="14" y="83" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">零 LLM 编译器把米/弧度</text>
    <text x="14" y="100" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">意图转为 SolidWorks 操作，</text>
    <text x="14" y="117" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">含轮廓交叉预检与 Undo。</text>
  </g>

  <line x1="706" y1="163" x2="726" y2="163" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#wfArrow)" />

  <!-- Card 4 -->
  <g transform="translate(728, 92)">
    <rect x="0" y="0" width="208" height="142" rx="12" fill="#0F192D" stroke="#2B4E6B" stroke-width="1.3" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#2DD4BF" />
    <rect x="14" y="16" width="38" height="20" rx="6" fill="#102C36" />
    <text x="33" y="30" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#2DD4BF">04</text>
    <text x="60" y="30" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">客观测量与核图</text>
    <text x="14" y="54" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#5EEAD4">GetExtremePoint + 4-View</text>
    <line x1="14" y1="64" x2="194" y2="64" stroke="#183640" />
    <text x="14" y="83" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">精确量包络（max(1mm,2%)）、</text>
    <text x="14" y="100" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">同轴圆柱表面点与四视图</text>
    <text x="14" y="117" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">同屏逐视图比对。</text>
  </g>

  <line x1="938" y1="163" x2="958" y2="163" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#wfArrow)" />

  <!-- Card 5 -->
  <g transform="translate(960, 92)">
    <rect x="0" y="0" width="208" height="142" rx="12" fill="#0D221E" stroke="#1E5D47" stroke-width="1.3" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#10B981" />
    <rect x="14" y="16" width="38" height="20" rx="6" fill="#11382B" />
    <text x="33" y="30" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#34D399">05</text>
    <text x="60" y="30" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">可信分级收尾</text>
    <text x="14" y="54" font-family="'Cascadia Mono', monospace" font-size="10.5" fill="#6EE7B7">finish_job → verified</text>
    <line x1="14" y1="64" x2="194" y2="64" stroke="#1A4537" />
    <text x="14" y="83" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">保存后核对全部指标；</text>
    <text x="14" y="100" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">只要存在未核实缺口，</text>
    <text x="14" y="117" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#CBD5E1">最高只给 built_unverified。</text>
  </g>

  <!-- Feedback Loop Arc: Card 4 back to Card 3 -->
  <path d="M 832 234 L 832 254 Q 832 264 822 264 L 610 264 Q 600 264 600 254 L 600 238" fill="none" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#wfLoopArrow)" />
  <rect x="618" y="253" width="196" height="20" rx="10" fill="#211709" stroke="#F59E0B" stroke-opacity="0.55" />
  <text x="716" y="267" text-anchor="middle" font-family="'Cascadia Mono', 'Microsoft YaHei', monospace" font-size="10.5" font-weight="700" fill="#FCD34D">PLAN_MISMATCH · 丢弃重建</text>

  <!-- Bottom Trust Level Scale -->
  <g transform="translate(32, 286)">
    <rect x="0" y="0" width="1136" height="54" rx="10" fill="#0B1323" stroke="#223659" stroke-width="1.1" />
    <text x="18" y="31" font-family="'Cascadia Mono', monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">TRUST LEVEL GATE</text>

    <rect x="166" y="12" width="190" height="30" rx="7" fill="#231218" stroke="#7F1D1D" />
    <text x="261" y="31" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11.5" font-weight="700" fill="#FCA5A5">unverified (拒认完成)</text>

    <text x="372" y="32" font-family="'Cascadia Mono', monospace" font-size="14" fill="#475569">→</text>

    <rect x="394" y="12" width="220" height="30" rx="7" fill="#172033" stroke="#334E7B" />
    <text x="504" y="31" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11.5" font-weight="700" fill="#93C5FD">drawing_consistent (工程图)</text>

    <text x="630" y="32" font-family="'Cascadia Mono', monospace" font-size="14" fill="#475569">→</text>

    <rect x="652" y="12" width="234" height="30" rx="7" fill="#261D0B" stroke="#92400E" />
    <text x="769" y="31" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11.5" font-weight="700" fill="#FCD34D">built_unverified (存在缺口)</text>

    <text x="902" y="32" font-family="'Cascadia Mono', monospace" font-size="14" fill="#475569">→</text>

    <rect x="924" y="12" width="194" height="30" rx="7" fill="#0D291F" stroke="#10B981" />
    <text x="1021" y="31" text-anchor="middle" font-family="'Cascadia Mono', monospace" font-size="11.5" font-weight="700" fill="#6EE7B7">verified ✓ (全项核实)</text>
  </g>
</svg>
